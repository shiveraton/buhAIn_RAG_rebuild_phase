<ion-card>
  <ion-card-header>
    <ion-card-title>Pipeline Visualization</ion-card-title>
    <ion-card-subtitle>{{ experimentId }}</ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    <ion-grid>
      <ion-row *ngFor="let step of pipelineSteps; let i = index">
        <ion-col size="12" class="ion-text-center">
          <ion-badge color="success" *ngIf="step.status === 'completed'">Done</ion-badge>
          <p>{{ i + 1 }}. {{ step.name }}</p>
          <small>{{ step.description }}</small>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card-content>
</ion-card>
