<ion-card>
  <ion-card-header>
    <ion-card-title>Model Evaluation ({{ experimentId }})</ion-card-title>
  </ion-card-header>
  <ion-card-content>
    <ion-grid>
      <ion-row>
        <ion-col *ngFor="let label of labels; let i = index" size="3" class="ion-text-center">
          <strong>{{ label }}</strong>
          <div *ngFor="let value of confusionMatrix[i]">{{ value }}</div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card-content>
</ion-card>
