<ion-card>
  <ion-card-header>
    <ion-card-title>Pipeline Control</ion-card-title>
    <ion-card-subtitle *ngIf="currentExperiment">{{ currentExperiment }}</ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    <ion-button expand="block" (click)="handleRunPipeline()" [disabled]="isRunning">
      {{ isRunning ? 'Running Pipeline...' : 'Run Pipeline' }}
    </ion-button>
  </ion-card-content>
</ion-card>
