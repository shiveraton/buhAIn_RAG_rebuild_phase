<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>My Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="profile-bg">
  <div *ngIf="isLoading" class="loading-container">
    <ion-card class="ion-margin-top">
      <ion-card-content>
        <div class="loading-content">
          <ion-spinner name="dots" color="primary"></ion-spinner>
          <ion-text color="medium">
            <p>Loading your profile...</p>
          </ion-text>
        </div>
      </ion-card-content>
    </ion-card>
  </div>

  <div *ngIf="!isLoading && userProfile" class="authenticated-profile">
    <ion-card class="profile-info-card ion-margin-top">
      <ion-card-header>
        <ion-avatar class="profile-avatar">
          <img [src]="'https://api.dicebear.com/7.x/bottts/svg?seed='" alt="User Avatar" />
        </ion-avatar>
        <ion-card-title class="ion-margin-top">{{ userProfile['username'] }}</ion-card-title>
        <ion-card-subtitle>{{ userProfile['email'] }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-button expand="block" color="danger" fill="outline" (click)="logout()" tappable>
          <ion-icon name="log-out" slot="start"></ion-icon>
          Logout
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
